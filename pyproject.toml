[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posefix"
version = "0.3.0"
description = "Provider-agnostic pose-correction engine, skills, and MCP-ready toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PoseFix contributors"}]
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
openai = ["openai>=3.19.2"]
service = [
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "python-multipart>=0.0.20",
  "pillow>=11.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "httpx>=0.28",
  "fastapi>=0.116",
  "python-multipart>=0.0.20",
  "pillow>=11.0",
]

[project.scripts]
posefix = "posefix.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["posefix*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
