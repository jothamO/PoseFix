name: Feature request
description: Propose a focused improvement to PoseFix
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Where does this belong?
      options:
        - Skill/domain logic
        - Deterministic engine
        - Provider adapter
        - Preset/registry
        - Schema/contract
        - Documentation/tooling
        - Unsure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Link research or describe test cases that justify the change.
